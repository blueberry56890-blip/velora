<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Title -->
  <title>VELORA | Fashion, Jewelry & Beauty</title>

  <!-- SEO Meta Description -->
  <meta name="description"
        content="Discover fashion, jewelry and beauty inspiration at VELORA. Explore stylish products, latest trends and fashion guides.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #222;
    }

    header {
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 28px;
      letter-spacing: 5px;
      font-weight: bold;
    }

    nav a {
      text-decoration: none;
      color: #222;
      margin-left: 25px;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: #f5f2ee;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 25px;
      color: #555;
    }

    .shop-button {
      display: inline-block;
      padding: 14px 30px;
      background: #111;
      color: white;
      text-decoration: none;
    }

    .categories {
      padding: 60px 8%;
      text-align: center;
    }

    .categories h2 {
      margin-bottom: 35px;
      font-size: 32px;
    }

    .category-container {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .category {
      width: 260px;
      padding: 60px 20px;
      background: #f7f7f7;
      font-size: 22px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">VELORA</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">Blog</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>

    <section class="hero">
      <h1>Wear Your Style.</h1>

      <p>
        Discover fashion, jewelry and beauty made for your everyday style.
      </p>

      <a href="#" class="shop-button">Explore Collection</a>
    </section>

    <section class="categories">

      <h2>Shop by Category</h2>

      <div class="category-container">

        <div class="category">
          Clothing
        </div>

       <div class="category">
  <a href="jewelry/gold-pendant-necklace/">
    Jewelry
  </a>
</div>

        <div class="category">
          Beauty
        </div>

      </div>

    </section>

  </main>

  <footer>
    <p>© 2026 VELORA — Wear Your Style.</p>
  </footer>

</body>
</html>
